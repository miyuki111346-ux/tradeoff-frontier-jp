<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本政策・戦略資料アーカイブ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #ffffff;
    color: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }

  header {
    margin-bottom: 4rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #f0f0f0;
  }

  h1 {
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #000000 0%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: #666666;
    font-size: 1.1rem;
    font-weight: 400;
    margin-top: 0.5rem;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .stat-card {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    transition: all 0.3s ease;
    width: auto;
  }

  .stat-card:hover {
    background: #ffffff;
    border-color: #e0e0e0;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
  }

  .stat-label {
    color: #999999;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0;
    white-space: nowrap;
  }

  .stat-value {
    font-size: 1.1rem;
    font-weight: 800;
    background: linear-gradient(135deg, #000000 0%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .artifacts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 2rem;
    margin-bottom: 3rem;
  }

  .artifact-card {
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
  }

  .artifact-card:hover {
    border-color: #7c3aed;
    box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
    transform: translateY(-4px);
  }

  .artifact-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .artifact-name {
    font-size: 1.25rem;
    font-weight: 700;
    color: #0a0a0a;
    margin-bottom: 1rem;
    word-break: break-word;
    line-height: 1.4;
  }

  .artifact-url {
    color: #999999;
    font-size: 0.8rem;
    margin-bottom: 1.5rem;
    word-break: break-all;
    opacity: 0.7;
  }

  .artifact-actions {
    display: flex;
    gap: 0.75rem;
  }

  .artifact-actions a {
    flex: 1;
    padding: 0.75rem;
    background: linear-gradient(135deg, #000000 0%, #7c3aed 100%);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    text-decoration: none;
    text-align: center;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .artifact-actions a:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
  }

  .loading {
    text-align: center;
    padding: 3rem 2rem;
    color: #999999;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: #999999;
  }

  .progress-text {
    text-align: center;
    color: #999999;
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }

  footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid #f0f0f0;
    text-align: center;
    color: #999999;
    font-size: 0.875rem;
  }

  @media (max-width: 768px) {
    .container {
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2.5rem;
    }

    .artifacts-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>日本政策・戦略資料アーカイブ</h1>
    </header>

    <div id="artifacts" class="tab-content active">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">登録済み成果物</div>
          <div class="stat-value" id="artifactCount">0</div>
        </div>
      </div>

      <div id="progressText" class="progress-text"></div>
      <div id="artifactGrid" class="artifacts-grid">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <footer>
      <p>日本政策・戦略資料アーカイブ v5.2</p>
    </footer>
  </div>

  <script>
    const NETLIFY_TOKEN = 'nfp_WfXPysUc9VFfbBFt2SeFMznyRtkEZMFi6ebb'
    const artifactGrid = document.getElementById('artifactGrid');
    const artifactCount = document.getElementById('artifactCount');
    const progressText = document.getElementById('progressText');

    // Netlify Function経由でHTMLを取得し、日本語タイトルを抽出（CORS回避）
    async function fetchPageTitle(url) {
      try {
        const httpsUrl = url.replace('http://', 'https://');
        const functionUrl = `/.netlify/functions/get-title?url=${encodeURIComponent(httpsUrl)}`;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(functionUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) return null;

        const data = await response.json();
        return data.title || null;
      } catch (error) {
        return null;
      }
    }

    // 同時実行数を制限しながら全サイトのタイトルを取得
    async function fetchTitlesWithConcurrency(sites, concurrency = 10) {
      const results = new Array(sites.length);
      let index = 0;
      let completed = 0;

      async function worker() {
        while (index < sites.length) {
          const current = index++;
          const site = sites[current];
          const url = site.url || site.ssl_url || `https://${site.name}.netlify.app`;
          const title = await fetchPageTitle(url);
          results[current] = title;
          completed++;
          progressText.textContent = `日本語タイトルを取得中... (${completed}/${sites.length})`;
        }
      }

      const workers = Array.from({ length: concurrency }, () => worker());
      await Promise.all(workers);
      return results;
    }

    async function fetchNetlifySites() {
      try {
        const response = await fetch('https://api.netlify.com/api/v1/sites?per_page=100', {
          headers: {
            'Authorization': `Bearer ${NETLIFY_TOKEN}`
          }
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        let allSites = await response.json();
        let page = 2;
        while (allSites.length < 100) {
          const nextResponse = await fetch(`https://api.netlify.com/api/v1/sites?per_page=100&page=${page}`, {
            headers: {
              'Authorization': `Bearer ${NETLIFY_TOKEN}`
            }
          });
          if (!nextResponse.ok) break;
          const nextSites = await nextResponse.json();
          if (nextSites.length === 0) break;
          allSites = allSites.concat(nextSites);
          page++;
        }

        artifactCount.textContent = allSites.length;

        // まずサイト名で即座に表示
        renderNetlifySites(allSites, allSites.map(() => null));

        // その後、日本語タイトルを取得して更新
        const titles = await fetchTitlesWithConcurrency(allSites);
        progressText.textContent = '';
        renderNetlifySites(allSites, titles);
      } catch (error) {
        artifactGrid.innerHTML = `
          <div class="empty-state">
            <p>Netlifyプロジェクトの読み込みに失敗しました</p>
            <p style="font-size: 0.9rem;">トークンが正しいか確認してください</p>
          </div>
        `;
        console.error('Error:', error);
      }
    }

    function renderNetlifySites(sites, titles) {
      if (sites.length === 0) {
        artifactGrid.innerHTML = `<div class="empty-state">プロジェクトなし</div>`;
        return;
      }

      const cardsHtml = sites.map((site, i) => {
        const url = site.url || site.ssl_url || `https://${site.name}.netlify.app`;
        const displayName = titles[i] || site.name;

        return `
          <div class="artifact-card">
            <div class="artifact-content">
              <div class="artifact-name">${displayName}</div>
              <div class="artifact-url">${url}</div>
              <div class="artifact-actions">
                <a href="${url}" target="_blank">表示</a>
              </div>
            </div>
          </div>
        `;
      }).join('');

      artifactGrid.innerHTML = cardsHtml;
    }

    if (NETLIFY_TOKEN === 'nfp_WfXPysUc9VFfbBFt2SeFMznyRtkEZMFi6ebb') {
      fetchNetlifySites();
    } else {
      artifactGrid.innerHTML = `
        <div class="empty-state">
          <p>Netlifyトークンを設定してください</p>
        </div>
      `;
    }
  </script>
</body>
</html>
