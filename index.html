<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制作管理ダッシュボード</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3142;
      --accent: #00d9ff;
      --accent-glow: rgba(0, 217, 255, 0.2);
      --text-primary: #f0f4f8;
      --text-secondary: #b0bcc4;
      --text-muted: #7a8492;
      --border: rgba(0, 217, 255, 0.15);
      --success: #00ff88;
      --warning: #ffa500;
      --critical: #ff4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--text-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .tab-button {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-button:hover {
      color: var(--text-primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 1.3rem;
      background: var(--accent);
      border-radius: 2px;
    }

    .main-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    @media (max-width: 768px) {
      .main-section {
        grid-template-columns: 1fr;
      }
    }

    .form-card, .list-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    input[type="text"], select, textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
      width: 100%;
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .list-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item {
      background: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }

    .item-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .item-meta {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .item-delete {
      background: transparent;
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: var(--critical);
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .status-success {
      background: rgba(0, 255, 136, 0.15);
      color: var(--success);
    }

    .status-building {
      background: rgba(255, 165, 0, 0.15);
      color: var(--warning);
    }

    .status-failed {
      background: rgba(255, 68, 68, 0.15);
      color: var(--critical);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .deploy-link {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .deploy-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>制作管理ダッシュボード</h1>
      <p class="subtitle">趣味の静的サイト制作プロジェクト、進捗管理</p>
    </header>

    <div class="tabs">
      <button class="tab-button active" data-tab="tasks">タスク管理</button>
      <button class="tab-button" data-tab="deployments">Netlifyデプロイ</button>
    </div>

    <!-- タスク管理タブ -->
    <div id="tasks" class="tab-content active">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">総タスク数</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">完了済み</div>
          <div class="stat-value" id="completedCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">進捗率</div>
          <div class="stat-value" id="progressRate">0%</div>
        </div>
      </div>

      <div class="main-section">
        <div class="form-card">
          <h2 class="section-title">新しいタスクを追加</h2>
          <form id="taskForm">
            <div class="form-group">
              <label for="taskTitle">タスク名 *</label>
              <input type="text" id="taskTitle" placeholder="例：ホーム画面のデザイン" required>
            </div>
            <div class="form-group">
              <label for="taskDesc">説明</label>
              <textarea id="taskDesc" placeholder="このタスクの詳細を記入してください..." rows="4"></textarea>
            </div>
            <div class="form-group">
              <label for="taskPriority">優先度</label>
              <select id="taskPriority">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">タスクを追加</button>
          </form>
        </div>

        <div class="list-card">
          <h2 class="section-title">タスク一覧</h2>
          <div id="taskList" class="list-items">
            <div class="empty-state"><p>タスクはまだありません</p></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Netlifyデプロイタブ -->
    <div id="deployments" class="tab-content">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">総デプロイ数</div>
          <div class="stat-value" id="deployCount">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">成功</div>
          <div class="stat-value" id="deploySuccess">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">最新ステータス</div>
          <div class="stat-value" id="deployLatestStatus">-</div>
        </div>
      </div>

      <div class="list-card">
        <h2 class="section-title">デプロイ履歴</h2>
        <div id="deployList" class="list-items">
          <div class="loading">読み込み中...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const NETLIFY_API_TOKEN = 'nfp_bWnTBy4nutnELau4fSqvYPtktKqNVwGw535e';
    const NETLIFY_SITE_ID = 'tradeoff-frontier-jp';

    // ===== タスク管理 =====
    const taskForm = document.getElementById('taskForm');
    const taskTitle = document.getElementById('taskTitle');
    const taskDesc = document.getElementById('taskDesc');
    const taskPriority = document.getElementById('taskPriority');
    const taskList = document.getElementById('taskList');

    let tasks = [];
    let nextId = 1;

    function addTask(e) {
      e.preventDefault();
      if (!taskTitle.value.trim()) return;

      tasks.push({
        id: nextId++,
        title: taskTitle.value.trim(),
        description: taskDesc.value.trim(),
        priority: taskPriority.value,
        completed: false
      });

      renderTasks();
      updateTaskStats();
      taskForm.reset();
      taskTitle.focus();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      renderTasks();
      updateTaskStats();
    }

    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state"><p>タスクはまだありません</p></div>';
        return;
      }

      taskList.innerHTML = tasks.map(task => `
        <div class="item">
          <div>
            <div class="item-title">${escapeHtml(task.title)}</div>
            ${task.description ? `<div class="item-desc">${escapeHtml(task.description)}</div>` : ''}
            <div class="status-badge status-${task.priority === 'high' ? 'failed' : task.priority === 'medium' ? 'building' : 'success'}">
              優先度: ${task.priority === 'high' ? '高' : task.priority === 'medium' ? '中' : '低'}
            </div>
          </div>
          <button class="item-delete" onclick="deleteTask(${task.id})">✕</button>
        </div>
      `).join('');
    }

    function updateTaskStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('completedCount').textContent = completed;
      document.getElementById('progressRate').textContent = total === 0 ? '0%' : Math.round((completed / total) * 100) + '%';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    taskForm.addEventListener('submit', addTask);

    // ===== Netlifyデプロイ取得 =====
    async function fetchNetlifyDeployments() {
      try {
        const response = await fetch(`https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys`, {
          headers: {
            'Authorization': `Bearer ${NETLIFY_API_TOKEN}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch deployments');

        const deploys = await response.json();
        renderDeployments(deploys);
        updateDeployStats(deploys);
      } catch (error) {
        document.getElementById('deployList').innerHTML = `<div class="empty-state"><p>デプロイ情報を取得できませんでした</p></div>`;
      }
    }

    function renderDeployments(deploys) {
      if (!deploys || deploys.length === 0) {
        document.getElementById('deployList').innerHTML = '<div class="empty-state"><p>デプロイがありません</p></div>';
        return;
      }

      document.getElementById('deployList').innerHTML = deploys.slice(0, 10).map(deploy => `
        <div class="item">
          <div>
            <div class="item-title">デプロイ ID: ${deploy.id.slice(0, 8)}</div>
            <div class="item-desc">
              <a href="${deploy.deploy_url}" class="deploy-link" target="_blank">${deploy.deploy_url}</a>
            </div>
            <div class="item-meta">
              ${new Date(deploy.created_at).toLocaleString('ja-JP')}
            </div>
            <div class="status-badge status-${deploy.state === 'ready' ? 'success' : deploy.state === 'building' ? 'building' : 'failed'}">
              ${deploy.state === 'ready' ? '成功' : deploy.state === 'building' ? 'ビルド中' : '失敗'}
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateDeployStats(deploys) {
      if (!deploys) deploys = [];
      const total = deploys.length;
      const success = deploys.filter(d => d.state === 'ready').length;
      const latest = deploys[0];

      document.getElementById('deployCount').textContent = total;
      document.getElementById('deploySuccess').textContent = success;
      document.getElementById('deployLatestStatus').textContent = latest 
        ? (latest.state === 'ready' ? '成功' : latest.state === 'building' ? 'ビルド中' : '失敗')
        : '-';
    }

    // ===== タブ切り替え =====
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        button.classList.add('active');
        document.getElementById(button.dataset.tab).classList.add('active');

        if (button.dataset.tab === 'deployments') {
          fetchNetlifyDeployments();
        }
      });
    });

    // 初期化
    updateTaskStats();
    renderTasks();
  </script>
</body>
</html>
