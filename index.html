<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制作管理ダッシュボード</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3142;
      --accent: #00d9ff;
      --accent-glow: rgba(0, 217, 255, 0.2);
      --text-primary: #f0f4f8;
      --text-secondary: #b0bcc4;
      --text-muted: #7a8492;
      --border: rgba(0, 217, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--text-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .main-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .main-section {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.3rem;
      background: var(--accent);
      border-radius: 2px;
    }

    .form-card, .task-list-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    input[type="text"], select, textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
      width: 100%;
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .task-item {
      background: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .task-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }

    .task-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .task-delete {
      background: transparent;
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff4444;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>制作管理ダッシュボード</h1>
      <p class="subtitle">趣味の静的サイト制作プロジェクト、進捗管理</p>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">総タスク数</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">完了済み</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">進捗率</div>
        <div class="stat-value" id="progressRate">0%</div>
      </div>
    </div>

    <div class="main-section">
      <div class="form-card">
        <h2 class="section-title">新しいタスクを追加</h2>
        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">タスク名 *</label>
            <input type="text" id="taskTitle" placeholder="例：ホーム画面のデザイン" required>
          </div>
          <div class="form-group">
            <label for="taskDesc">説明</label>
            <textarea id="taskDesc" placeholder="このタスクの詳細を記入してください..." rows="4"></textarea>
          </div>
          <div class="form-group">
            <label for="taskPriority">優先度</label>
            <select id="taskPriority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">タスクを追加</button>
        </form>
      </div>

      <div class="task-list-card">
        <h2 class="section-title">タスク一覧</h2>
        <div id="taskList" class="task-list">
          <div class="empty-state">
            <p>タスクはまだありません</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskTitle = document.getElementById('taskTitle');
    const taskDesc = document.getElementById('taskDesc');
    const taskPriority = document.getElementById('taskPriority');
    const taskList = document.getElementById('taskList');
    const totalCount = document.getElementById('totalCount');
    const completedCount = document.getElementById('completedCount');
    const progressRate = document.getElementById('progressRate');

    let tasks = [];
    let nextId = 1;

    function addTask(e) {
      e.preventDefault();
      if (!taskTitle.value.trim()) return;

      const task = {
        id: nextId++,
        title: taskTitle.value.trim(),
        description: taskDesc.value.trim(),
        priority: taskPriority.value,
        completed: false
      };

      tasks.push(task);
      renderTasks();
      updateStats();
      taskForm.reset();
      taskTitle.focus();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      renderTasks();
      updateStats();
    }

    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state"><p>タスクはまだありません</p></div>';
        return;
      }

      taskList.innerHTML = tasks.map(task => `
        <div class="task-item">
          <div>
            <div class="task-title">${escapeHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
          </div>
          <button class="task-delete" onclick="deleteTask(${task.id})">✕</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const progress = total === 0 ? 0 : Math.round((completed / total) * 100);

      totalCount.textContent = total;
      completedCount.textContent = completed;
      progressRate.textContent = progress + '%';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    taskForm.addEventListener('submit', addTask);
    updateStats();
    renderTasks();
  </script>
</body>
</html>
