<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制作管理ダッシュボード</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3142;
      --accent: #00d9ff;
      --accent-glow: rgba(0, 217, 255, 0.2);
      --text-primary: #f0f4f8;
      --text-secondary: #b0bcc4;
      --text-muted: #7a8492;
      --border: rgba(0, 217, 255, 0.15);
      --success: #00ff88;
      --warning: #ffa500;
      --critical: #ff4444;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f1419;
        --bg-secondary: #1a1f2e;
        --bg-tertiary: #2a3142;
        --accent: #00d9ff;
        --text-primary: #f0f4f8;
        --text-secondary: #b0bcc4;
      }
    }

    :root[data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #eef2f8;
      --accent: #0066cc;
      --accent-glow: rgba(0, 102, 204, 0.08);
      --text-primary: #1a1f2e;
      --text-secondary: #4a5568;
      --text-muted: #8892a0;
      --border: rgba(0, 102, 204, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.5;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--text-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .form-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .artifacts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .artifact-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .artifact-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      transform: translateY(-4px);
    }

    .artifact-header {
      background: linear-gradient(135deg, var(--accent) 0%, rgba(0, 217, 255, 0.1) 100%);
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .artifact-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .artifact-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .artifact-url {
      color: var(--accent);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      word-break: break-all;
      opacity: 0.8;
    }

    .artifact-actions {
      display: flex;
      gap: 0.5rem;
    }

    .artifact-actions a {
      flex: 1;
      padding: 0.5rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }
      h1 {
        font-size: 2rem;
      }
      .stats {
        grid-template-columns: 1fr;
      }
      .artifacts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>制作管理ダッシュボード</h1>
      <p class="subtitle">Netlifyプロジェクト一覧・タスク管理</p>
    </header>

    <div class="tabs">
      <button class="tab-button active" data-tab="artifacts">成果物</button>
      <button class="tab-button" data-tab="tasks">タスク管理</button>
    </div>

    <div id="artifacts" class="tab-content active">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">登録済み成果物</div>
          <div class="stat-value" id="artifactCount">0</div>
        </div>
      </div>

      <h2 class="section-title">Netlifyプロジェクト一覧</h2>
      <div id="artifactGrid" class="artifacts-grid">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <div id="tasks" class="tab-content">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">総タスク数</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
      </div>

      <div class="form-card">
        <h2 class="section-title">新しいタスクを追加</h2>
        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">タスク名 *</label>
            <input type="text" id="taskTitle" placeholder="タスク名" required>
          </div>
          <div class="button-group">
            <button type="submit" class="btn-primary">追加</button>
          </div>
        </form>
      </div>

      <div id="taskList" class="form-card" style="margin-top: 2rem;">
        <h2 class="section-title">タスク一覧</h2>
        <div style="display: flex; flex-direction: column; gap: 1rem;" id="taskListContainer">
          <div class="empty-state">タスクなし</div>
        </div>
      </div>
    </div>

    <footer>
      <p>制作管理ダッシュボード v3.0</p>
    </footer>
  </div>

  <script>
    const NETLIFY_TOKEN = 'nfp_5xi656QWKZwC2AGm77KEmXNeDcUDySHV0510'
    const emojiPatterns = ['📋', '🎨', '✨', '📊', '🌐', '🚀', '💻', '🎯'];
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const tabName = button.getAttribute('data-tab');
        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(tabName).classList.add('active');
      });
    });

    const artifactGrid = document.getElementById('artifactGrid');
    const artifactCount = document.getElementById('artifactCount');

    async function fetchNetlifySites() {
      try {
        const response = await fetch('https://api.netlify.com/api/v1/sites?per_page=100', {
          headers: {
            'Authorization': `Bearer ${NETLIFY_TOKEN}`
          }
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        let allSites = await response.json();
        let page = 2;
        while (allSites.length < 100) {
          const nextResponse = await fetch(`https://api.netlify.com/api/v1/sites?per_page=100&page=${page}`, {
            headers: {
              'Authorization': `Bearer ${NETLIFY_TOKEN}`
            }
          });
          if (!nextResponse.ok) break;
          const nextSites = await nextResponse.json();
          if (nextSites.length === 0) break;
          allSites = allSites.concat(nextSites);
          page++;
        }

        renderNetlifySites(allSites);
        artifactCount.textContent = allSites.length;
      } catch (error) {
        artifactGrid.innerHTML = `
          <div class="empty-state">
            <p>Netlifyプロジェクトの読み込みに失敗しました</p>
            <p style="font-size: 0.9rem;">トークンが正しいか確認してください</p>
          </div>
        `;
        console.error('Error:', error);
      }
    }

    function renderNetlifySites(sites) {
      if (sites.length === 0) {
        artifactGrid.innerHTML = `<div class="empty-state">プロジェクトなし</div>`;
        return;
      }

      artifactGrid.innerHTML = sites.map((site, index) => {
        const emoji = emojiPatterns[index % emojiPatterns.length];
        const url = site.url || site.ssl_url || `https://${site.name}.netlify.app`;
        return `
          <div class="artifact-card">
            <div class="artifact-header">${emoji}</div>
            <div class="artifact-content">
              <div class="artifact-name">${site.name}</div>
              <div class="artifact-url">${url}</div>
              <div class="artifact-actions">
                <a href="${url}" target="_blank">表示</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    if (NETLIFY_TOKEN === 'nfp_5xi656QWKZwC2AGm77KEmXNeDcUDySHV0510') {
      fetchNetlifySites();
    } else {
      artifactGrid.innerHTML = `
        <div class="empty-state">
          <p>Netlifyトークンを設定してください</p>
        </div>
      `;
    }

    // Task管理
    const taskForm = document.getElementById('taskForm');
    const taskTitle = document.getElementById('taskTitle');
    const totalCount = document.getElementById('totalCount');
    const taskListContainer = document.getElementById('taskListContainer');
    let tasks = [];

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!taskTitle.value.trim()) return;
      tasks.push({ id: Date.now(), title: taskTitle.value.trim() });
      taskTitle.value = '';
      renderTasks();
      updateStats();
    });

    function renderTasks() {
      if (tasks.length === 0) {
        taskListContainer.innerHTML = '<div class="empty-state">タスクなし</div>';
        return;
      }
      taskListContainer.innerHTML = tasks.map(task => `
        <div style="padding: 1rem; background: var(--bg-tertiary); border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
          <span>${task.title}</span>
          <button onclick="deleteTask(${task.id})" style="background: #ff4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">削除</button>
        </div>
      `).join('');
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
      updateStats();
    }

    function updateStats() {
      totalCount.textContent = tasks.length;
    }

    renderTasks();
  </script>
</body>
</html>
