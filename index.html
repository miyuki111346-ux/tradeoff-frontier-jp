<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>制作管理ダッシュボード</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3142;
      --accent: #00d9ff;
      --accent-glow: rgba(0, 217, 255, 0.2);
      --text-primary: #f0f4f8;
      --text-secondary: #b0bcc4;
      --text-muted: #7a8492;
      --border: rgba(0, 217, 255, 0.15);
      --success: #00ff88;
      --warning: #ffa500;
      --critical: #ff4444;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f1419;
        --bg-secondary: #1a1f2e;
        --bg-tertiary: #2a3142;
        --accent: #00d9ff;
        --text-primary: #f0f4f8;
        --text-secondary: #b0bcc4;
      }
    }

    :root[data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #eef2f8;
      --accent: #0066cc;
      --accent-glow: rgba(0, 102, 204, 0.08);
      --text-primary: #1a1f2e;
      --text-secondary: #4a5568;
      --text-muted: #8892a0;
      --border: rgba(0, 102, 204, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ===== Header ===== */
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.5;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--text-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      text-wrap: balance;
    }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .tab-button:hover {
      color: var(--accent);
    }

    .tab-button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== Stats ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.5;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-wrap: balance;
    }

    /* ===== Main Section ===== */
    .main-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .main-section {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.3rem;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ===== Form ===== */
    .form-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.5;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input[type="text"]:focus,
    input[type="url"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-tertiary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-primary);
    }

    .btn-primary:hover {
      box-shadow: 0 0 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== Task List ===== */
    .task-list-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .task-list-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.5;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .task-item {
      background: var(--bg-tertiary);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      transition: all 0.2s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .task-item:hover {
      background: var(--bg-tertiary);
      border-left-color: var(--success);
      transform: translateX(4px);
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
      word-break: break-word;
    }

    .task-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .task-priority {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-top: 0.5rem;
    }

    .priority-high {
      background: rgba(255, 68, 68, 0.15);
      color: var(--critical);
    }

    .priority-medium {
      background: rgba(255, 165, 0, 0.15);
      color: var(--warning);
    }

    .priority-low {
      background: rgba(0, 255, 136, 0.15);
      color: var(--success);
    }

    .task-delete {
      background: transparent;
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: var(--critical);
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 8px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .task-delete:hover {
      background: rgba(255, 68, 68, 0.15);
      border-color: var(--critical);
    }

    /* ===== Artifact Grid ===== */
    .artifacts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .artifact-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.3s ease;
    }

    .artifact-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      transform: translateY(-4px);
    }

    .artifact-header {
      background: linear-gradient(135deg, var(--accent) 0%, rgba(0, 217, 255, 0.1) 100%);
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .artifact-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .artifact-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .artifact-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .artifact-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      flex: 1;
      word-break: break-word;
    }

    .artifact-url {
      color: var(--accent);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      word-break: break-all;
      opacity: 0.8;
    }

    .artifact-actions {
      display: flex;
      gap: 0.5rem;
    }

    .artifact-actions a {
      flex: 1;
      padding: 0.5rem;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .artifact-actions a:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .artifact-delete {
      background: rgba(255, 68, 68, 0.2);
      color: var(--critical);
      border: 1px solid var(--critical);
    }

    .artifact-delete:hover {
      background: rgba(255, 68, 68, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* ===== Footer ===== */
    footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .artifacts-grid {
        grid-template-columns: 1fr;
      }

      button {
        padding: 0.75rem 1rem;
      }

      .tabs {
        gap: 0.5rem;
      }

      .tab-button {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>制作管理ダッシュボード</h1>
      <p class="subtitle">趣味の静的サイト制作プロジェクト、進捗管理</p>
    </header>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab-button active" data-tab="tasks">タスク管理</button>
      <button class="tab-button" data-tab="artifacts">成果物</button>
    </div>

    <!-- Tasks Tab Content -->
    <div id="tasks" class="tab-content active">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">総タスク数</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">完了済み</div>
          <div class="stat-value" id="completedCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">進捗率</div>
          <div class="stat-value" id="progressRate">0%</div>
        </div>
      </div>

      <div class="main-section">
        <div class="form-card">
          <h2 class="section-title">新しいタスクを追加</h2>
          <form id="taskForm">
            <div class="form-group">
              <label for="taskTitle">タスク名 *</label>
              <input type="text" id="taskTitle" placeholder="例：ホーム画面のデザイン" required>
            </div>
            <div class="form-group">
              <label for="taskDesc">説明</label>
              <textarea id="taskDesc" placeholder="このタスクの詳細を記入してください..."></textarea>
            </div>
            <div class="form-group">
              <label for="taskPriority">優先度</label>
              <select id="taskPriority">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
              </select>
            </div>
            <div class="button-group">
              <button type="submit" class="btn-primary">タスクを追加</button>
              <button type="reset" class="btn-secondary">リセット</button>
            </div>
          </form>
        </div>

        <div class="task-list-card">
          <h2 class="section-title">タスク一覧</h2>
          <div id="taskList" class="task-list">
            <div class="empty-state">
              <div class="empty-state-icon">◯</div>
              <p>タスクはまだありません</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Artifacts Tab Content -->
    <div id="artifacts" class="tab-content">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">登録済み成果物</div>
          <div class="stat-value" id="artifactCount">0</div>
        </div>
      </div>

      <div class="form-card">
        <h2 class="section-title">新しい成果物を追加</h2>
        <form id="artifactForm">
          <div class="form-group">
            <label for="artifactName">プロジェクト名 *</label>
            <input type="text" id="artifactName" placeholder="例：政策整理メモ" required>
          </div>
          <div class="form-group">
            <label for="artifactDesc">説明</label>
            <textarea id="artifactDesc" placeholder="このプロジェクトについて..."></textarea>
          </div>
          <div class="form-group">
            <label for="artifactUrl">Netlify URL *</label>
            <input type="url" id="artifactUrl" placeholder="https://example.netlify.app" required>
          </div>
          <div class="button-group">
            <button type="submit" class="btn-primary">成果物を追加</button>
            <button type="reset" class="btn-secondary">リセット</button>
          </div>
        </form>
      </div>

      <h2 class="section-title" style="margin-top: 2rem;">登録済み成果物</h2>
      <div id="artifactGrid" class="artifacts-grid">
        <div class="empty-state">
          <div class="empty-state-icon">✧</div>
          <p>成果物はまだ登録されていません</p>
        </div>
      </div>
    </div>

    <footer>
      <p>制作管理ダッシュボード v2.0 | データはセッション中に保持されます</p>
    </footer>
  </div>

  <script>
    // ===== Tab Management =====
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const tabName = button.getAttribute('data-tab');
        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(tabName).classList.add('active');
      });
    });

    // ===== Task Management =====
    const taskForm = document.getElementById('taskForm');
    const taskTitle = document.getElementById('taskTitle');
    const taskDesc = document.getElementById('taskDesc');
    const taskPriority = document.getElementById('taskPriority');
    const taskList = document.getElementById('taskList');
    const totalCount = document.getElementById('totalCount');
    const completedCount = document.getElementById('completedCount');
    const progressRate = document.getElementById('progressRate');

    let tasks = [];
    let nextTaskId = 1;

    function addTask(e) {
      e.preventDefault();

      if (!taskTitle.value.trim()) return;

      const task = {
        id: nextTaskId++,
        title: taskTitle.value.trim(),
        description: taskDesc.value.trim(),
        priority: taskPriority.value,
        completed: false,
        created: new Date().toLocaleString('ja-JP')
      };

      tasks.push(task);
      renderTasks();
      updateStats();
      taskForm.reset();
      taskTitle.focus();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      renderTasks();
      updateStats();
    }

    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">◯</div>
            <p>タスクはまだありません</p>
          </div>
        `;
        return;
      }

      taskList.innerHTML = tasks.map(task => `
        <div class="task-item">
          <div class="task-content">
            <div class="task-title">${escapeHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
            <div class="task-priority priority-${task.priority}">
              ${getPriorityLabel(task.priority)}
            </div>
          </div>
          <button class="task-delete" onclick="deleteTask(${task.id})" title="削除">✕</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const progress = total === 0 ? 0 : Math.round((completed / total) * 100);

      totalCount.textContent = total;
      completedCount.textContent = completed;
      progressRate.textContent = progress + '%';
    }

    function getPriorityLabel(priority) {
      const labels = { high: '高', medium: '中', low: '低' };
      return labels[priority] || '中';
    }

    // ===== Artifact Management =====
    const artifactForm = document.getElementById('artifactForm');
    const artifactName = document.getElementById('artifactName');
    const artifactDesc = document.getElementById('artifactDesc');
    const artifactUrl = document.getElementById('artifactUrl');
    const artifactGrid = document.getElementById('artifactGrid');
    const artifactCount = document.getElementById('artifactCount');

    let artifacts = [
      {
        id: 1,
        name: '政策整理メモ',
        description: '政策関連の情報を整理したメモ',
        url: 'https://tradeoff-frontier-jp.netlify.app/',
        emoji: '📋'
      }
    ];
    let nextArtifactId = 2;

    function addArtifact(e) {
      e.preventDefault();

      if (!artifactName.value.trim() || !artifactUrl.value.trim()) return;

      const artifact = {
        id: nextArtifactId++,
        name: artifactName.value.trim(),
        description: artifactDesc.value.trim(),
        url: artifactUrl.value.trim(),
        emoji: '✨'
      };

      artifacts.push(artifact);
      renderArtifacts();
      updateArtifactCount();
      artifactForm.reset();
      artifactName.focus();
    }

    function deleteArtifact(id) {
      artifacts = artifacts.filter(a => a.id !== id);
      renderArtifacts();
      updateArtifactCount();
    }

    function renderArtifacts() {
      if (artifacts.length === 0) {
        artifactGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">✧</div>
            <p>成果物はまだ登録されていません</p>
          </div>
        `;
        return;
      }

      artifactGrid.innerHTML = artifacts.map(artifact => `
        <div class="artifact-card">
          <div class="artifact-header">${artifact.emoji}</div>
          <div class="artifact-content">
            <div class="artifact-name">${escapeHtml(artifact.name)}</div>
            ${artifact.description ? `<div class="artifact-desc">${escapeHtml(artifact.description)}</div>` : ''}
            <div class="artifact-url">${escapeHtml(artifact.url)}</div>
            <div class="artifact-actions">
              <a href="${artifact.url}" target="_blank" rel="noopener noreferrer">表示</a>
              <button class="artifact-delete" onclick="deleteArtifact(${artifact.id})" title="削除">削除</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateArtifactCount() {
      artifactCount.textContent = artifacts.length;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    taskForm.addEventListener('submit', addTask);
    artifactForm.addEventListener('submit', addArtifact);

    // Initialize
    updateStats();
    updateArtifactCount();
    renderTasks();
    renderArtifacts();
  </script>
</body>
</html>
